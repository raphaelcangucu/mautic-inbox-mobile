<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Filtros de conversas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1F3C88}a:hover{color:#16306E}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Manrope, system-ui, sans-serif; color: #141A26; position: relative; overflow: hidden">

  <div aria-hidden="true" style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 10px"><span style="width: 32px; height: 32px; border-radius: 10px; background: #1F3C88"></span><span style="width: 130px; height: 14px; border-radius: 7px; background: #D9DEE8"></span></div>
    <span style="width: 170px; height: 26px; border-radius: 8px; background: #D9DEE8"></span>
    <div style="display: flex; gap: 14px; align-items: center"><span style="width: 48px; height: 48px; border-radius: 24px; background: #E3E7EF"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><span style="width: 60%; height: 12px; border-radius: 6px; background: #D9DEE8"></span><span style="width: 85%; height: 10px; border-radius: 5px; background: #E8EBF1"></span></span></div>
    <div style="display: flex; gap: 14px; align-items: center"><span style="width: 48px; height: 48px; border-radius: 24px; background: #E3E7EF"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><span style="width: 45%; height: 12px; border-radius: 6px; background: #D9DEE8"></span><span style="width: 75%; height: 10px; border-radius: 5px; background: #E8EBF1"></span></span></div>
    <div style="display: flex; gap: 14px; align-items: center"><span style="width: 48px; height: 48px; border-radius: 24px; background: #E3E7EF"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><span style="width: 55%; height: 12px; border-radius: 6px; background: #D9DEE8"></span><span style="width: 90%; height: 10px; border-radius: 5px; background: #E8EBF1"></span></span></div>
  </div>
  <a href="Conversas.html" aria-label="Fechar filtros" style="position: absolute; inset: 0; background: rgba(15, 20, 32, 0.46)"></a>

  <section role="dialog" aria-label="Filtros" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 0 24px; display: flex; flex-direction: column">
    <span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #C9CFDA"></span>
    <div style="display: flex; align-items: center; padding: 14px 12px 6px 24px">
      <h2 style="margin: 0; flex: 1; font-size: 20px; font-weight: 800">Filtros</h2>
      <button style="height: 40px; padding: 0 12px; border: 0; background: transparent; border-radius: 20px; font-family: Manrope, system-ui, sans-serif; font-size: 15px; font-weight: 700; color: #1F3C88">Limpar</button>
    </div>

    <p style="margin: 10px 24px 10px; font-size: 13px; font-weight: 700; color: #3A4354">Fila</p>
    <div role="radiogroup" aria-label="Fila" style="margin: 0 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #C9CFDA; border-radius: 20px; overflow: hidden; height: 40px">
      <button role="radio" aria-checked="false" style="border: 0; border-right: 1px solid #C9CFDA; background: #FFFFFF; font-family: Manrope, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #3A4354">Todas</button>
      <button role="radio" aria-checked="true" style="border: 0; border-right: 1px solid #C9CFDA; background: #DCE4F7; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: Manrope, system-ui, sans-serif; font-size: 14px; font-weight: 700; color: #16306E"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Minhas</button>
      <button role="radio" aria-checked="false" style="border: 0; background: #FFFFFF; font-family: Manrope, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #3A4354">Sem atendente</button>
    </div>

    <p style="margin: 22px 24px 10px; font-size: 13px; font-weight: 700; color: #3A4354">Situação</p>
    <div style="margin: 0 24px; display: flex; flex-wrap: wrap; gap: 8px">
      <button aria-pressed="true" style="height: 36px; padding: 0 12px 0 8px; border-radius: 10px; border: 0; background: #DCE4F7; display: flex; align-items: center; gap: 6px; font-family: Manrope, system-ui, sans-serif; font-size: 14px; font-weight: 700; color: #16306E"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Abertas</button>
      <button aria-pressed="true" style="height: 36px; padding: 0 12px 0 8px; border-radius: 10px; border: 0; background: #DCE4F7; display: flex; align-items: center; gap: 6px; font-family: Manrope, system-ui, sans-serif; font-size: 14px; font-weight: 700; color: #16306E"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Aguardando resposta</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #D5DBE6; background: #FFFFFF; font-family: Manrope, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #3A4354">Adiadas</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #D5DBE6; background: #FFFFFF; font-family: Manrope, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #3A4354">Resolvidas</button>
    </div>

    <p style="margin: 22px 24px 4px; font-size: 13px; font-weight: 700; color: #3A4354">Canais</p>
    <div style="display: flex; flex-direction: column">
      <button aria-pressed="true" style="height: 52px; padding: 0 24px; border: 0; background: transparent; display: flex; align-items: center; gap: 14px; font-family: Manrope, system-ui, sans-serif; text-align: left; color: #141A26">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #1E8E4E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h3l1.5 4-2 1.5a10 10 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4 6a2 2 0 0 1 2-2z"></path></svg></span>
        <span style="flex: 1; font-size: 16px; font-weight: 600">WhatsApp</span><span style="font-size: 14px; color: #5E6779">31</span>
        <span style="width: 22px; height: 22px; border-radius: 6px; background: #1F3C88; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      </button>
      <button aria-pressed="true" style="height: 52px; padding: 0 24px; border: 0; background: transparent; display: flex; align-items: center; gap: 14px; font-family: Manrope, system-ui, sans-serif; text-align: left; color: #141A26">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #C1356F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="5"></rect><circle cx="12" cy="12" r="3.5"></circle></svg></span>
        <span style="flex: 1; font-size: 16px; font-weight: 600">Instagram</span><span style="font-size: 14px; color: #5E6779">12</span>
        <span style="width: 22px; height: 22px; border-radius: 6px; background: #1F3C88; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      </button>
      <button aria-pressed="false" style="height: 52px; padding: 0 24px; border: 0; background: transparent; display: flex; align-items: center; gap: 14px; font-family: Manrope, system-ui, sans-serif; text-align: left; color: #141A26">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #2F6FDB; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18.5V6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v7a2.5 2.5 0 0 1-2.5 2.5H9z"></path></svg></span>
        <span style="flex: 1; font-size: 16px; font-weight: 600">Messenger</span><span style="font-size: 14px; color: #5E6779">4</span>
        <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 6px; border: 2px solid #8A93A3"></span>
      </button>
      <button aria-pressed="true" style="height: 52px; padding: 0 24px; border: 0; background: transparent; display: flex; align-items: center; gap: 14px; font-family: Manrope, system-ui, sans-serif; text-align: left; color: #141A26">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #4A5568; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.5 12h17M12 3.5c2.5 3 2.5 14 0 17M12 3.5c-2.5 3-2.5 14 0 17"></path></svg></span>
        <span style="flex: 1; font-size: 16px; font-weight: 600">Chat do site</span><span style="font-size: 14px; color: #5E6779">9</span>
        <span style="width: 22px; height: 22px; border-radius: 6px; background: #1F3C88; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      </button>
      <button aria-pressed="true" style="height: 52px; padding: 0 24px; border: 0; background: transparent; display: flex; align-items: center; gap: 14px; font-family: Manrope, system-ui, sans-serif; text-align: left; color: #141A26">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #B4590F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M4 7l8 6 8-6"></path></svg></span>
        <span style="flex: 1; font-size: 16px; font-weight: 600">E-mail</span><span style="font-size: 14px; color: #5E6779">8</span>
        <span style="width: 22px; height: 22px; border-radius: 6px; background: #1F3C88; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      </button>
    </div>

    <a href="Conversas.html" style="margin: 16px 24px 0; height: 52px; border-radius: 14px; background: #1F3C88; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 700">Mostrar 10 conversas</a>
  </section>
</div>
</body>
</html>
