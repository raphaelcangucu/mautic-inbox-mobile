name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: ruby -c fastlane/Fastfile
      - run: gem install minitest --no-document --user-install
      - run: ruby fastlane/tests/review_draft_test.rb
      - run: ruby fastlane/tests/listing_guard_test.rb
      - run: npx expo export --platform ios --platform android --output-dir dist
